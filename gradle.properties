org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
kotlin.code.style=official

# 项目文件夹名是中文（全局命名规范），AGP 7.4.2 默认拒绝非 ASCII 工程路径，这里按其官方开关放行。
# 若后续 aapt2/dex 环节因中文路径出问题，再与老板商定 ASCII 联接目录方案。
android.overridePathCheck=true

# 构建需 JDK 11（本机实测在 E:\Java，用户 JAVA_HOME 已指向它；D:\jdk\jdk1 实为 1.8，勿用）。
# 换机或 JAVA_HOME 漂移时取消下一行注释：
# org.gradle.java.home=E:/Java
